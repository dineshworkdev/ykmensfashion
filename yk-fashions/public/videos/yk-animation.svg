<!-- T-shirt -->
<path d="M-60,-150C-60,-150,-130,-125,-130,-125C-130,-125,-200,-50,-200,-50C-200,-50,-160,0,-160,0C-160,0,-115,-25,-115,-25C-115,-25,-115,150,-115,150C-115,150,115,150,115,150C115,150,115,-25,115,-25C115,-25,160,0,160,0C160,0,200,-50,200,-50C200,-50,130,-125,130,-125C130,-125,60,-150,60,-150C60,-120,30,-105,0,-105C-30,-105,-60,-120,-60,-150C-60,-150,-60,-150,-60,-150Z" fill="#261c18" />

<!-- Premium embroidered YK: metallic gold thread appearance, integrated into fabric -->
<g id="embroideredYK" transform="translate(0,-12)" filter="url(#softEmbroideryShadow)">
  <text x="0" y="18" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="900" letter-spacing="-5"
        fill="url(#goldEmbroidery)" stroke="#7B5414" stroke-width="1.5"
        paint-order="stroke">YK</text>
  <text x="0" y="18" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="900" letter-spacing="-5"
        fill="none" stroke="#F5D982" stroke-width="1.2"
        stroke-dasharray="2.2 2.8" opacity="0.72">YK</text>
</g></g></g></g></g>
</svg>